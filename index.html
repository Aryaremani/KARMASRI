<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — bill extraction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ECE7D8;
    --paper-deep: #E2DCC9;
    --card: #FBF9F2;
    --line: #C7BEA4;
    --line-soft: #DAD3BE;
    --ink: #1E2B3C;
    --ink-soft: #5B6577;
    --ink-faint: #8B8F84;
    --green: #2F6B4F;
    --green-bg: #E4EEE6;
    --red: #B23A34;
    --red-bg: #F6E5E3;
    --gold: #A9772F;
    --gold-bg: #F1E5CE;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%),
      repeating-linear-gradient(180deg, transparent 0, transparent 27px, rgba(30,43,60,0.045) 28px);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 8px;
  }

  .brand-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 4px;
  }

  h1.brand {
    font-family: 'Archivo Narrow', sans-serif;
    font-weight: 700;
    font-size: 40px;
    letter-spacing: 0.01em;
    margin: 0;
    text-transform: uppercase;
  }

  .conn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
  .dot.on { background: var(--green); }
  .dot.off { background: var(--red); }

  .endpoint-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin: 18px 0 32px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .endpoint-row input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--line);
    color: var(--ink);
    padding: 4px 2px;
    width: 240px;
  }
  .endpoint-row input:focus { outline: none; border-bottom-color: var(--ink); }

  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 24px;
    position: relative;
  }

  .panel-title {
    font-family: 'Archivo Narrow', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 18px;
    color: var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .panel-title .idx { color: var(--ink-faint); font-weight: 500; }

  /* perforated tear edge */
  .panel.right { padding-top: 30px; }
  .panel.right::before {
    content: "";
    position: absolute;
    top: -1px; left: 0; right: 0; height: 12px;
    background-image: radial-gradient(circle at 50% 0, var(--paper) 5px, transparent 5.5px);
    background-size: 18px 12px;
    background-repeat: repeat-x;
  }

  /* dropzone */
  .drop {
    border: 2px dashed var(--line);
    border-radius: 3px;
    padding: 30px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .drop:hover, .drop.drag { border-color: var(--ink); background: var(--paper-deep); }
  .drop svg { width: 30px; height: 30px; margin-bottom: 10px; stroke: var(--ink-soft); }
  .drop-label { font-size: 14px; color: var(--ink); font-weight: 500; margin: 0 0 4px; }
  .drop-sub { font-size: 12px; color: var(--ink-faint); margin: 0; font-family: 'IBM Plex Mono', monospace; }
  input[type=file] { display: none; }

  .preview { margin-top: 18px; }
  .preview img { width: 100%; border: 1px solid var(--line); border-radius: 2px; display: block; }
  .preview .pdf-chip {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 2px; padding: 14px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink);
  }
  .filename {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin: 8px 2px 0;
    word-break: break-all;
  }

  button.primary {
    width: 100%;
    margin-top: 18px;
    background: var(--ink);
    color: var(--card);
    border: none;
    border-radius: 2px;
    padding: 13px;
    font-family: 'Archivo Narrow', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button.primary:disabled { background: var(--line); color: var(--ink-faint); cursor: not-allowed; }
  button.primary:not(:disabled):hover { background: #33465F; }

  .log {
    margin-top: 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--ink-soft);
    border-top: 1px dashed var(--line);
    padding-top: 12px;
    min-height: 20px;
  }
  .log .err { color: var(--red); }
  .log .ok { color: var(--green); }

  /* ledger fields */
  .field-row { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: end; padding: 10px 0; border-bottom: 1px dotted var(--line); }
  .field-row label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding-bottom: 6px;
  }
  .field-row input {
    border: none;
    background: transparent;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    padding: 4px 2px;
    width: 100%;
  }
  .field-row input:focus { outline: none; background: var(--paper-deep); }
  .field-row input::placeholder { color: var(--ink-faint); font-style: italic; }

  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .three-col .sub { display: flex; flex-direction: column; gap: 4px; }
  .three-col label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-faint); }
  .three-col input { font-family: 'IBM Plex Mono', monospace; font-size: 13px; border: none; border-bottom: 1px dotted var(--line); background: transparent; padding: 4px 0; color: var(--ink); }
  .three-col input:focus { outline: none; border-bottom-color: var(--ink); }

  .items-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 22px; margin-bottom: 8px;
  }
  .items-head span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint);
  }
  .add-row {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: none; border: 1px solid var(--line); border-radius: 2px;
    padding: 4px 10px; cursor: pointer; color: var(--ink-soft);
  }
  .add-row:hover { border-color: var(--ink); color: var(--ink); }

  .item-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0;
    border-bottom: 1px dotted var(--line-soft);
  }
  .item-row input.item-name {
    flex: 1; border: none; background: transparent; font-size: 13.5px; color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif; padding: 2px;
  }
  .item-row .leader { color: var(--ink-faint); font-size: 12px; user-select: none; }
  .item-row input.item-amt {
    width: 110px; text-align: right; border: none; background: transparent;
    font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; color: var(--ink); padding: 2px;
  }
  .item-row input:focus { outline: none; background: var(--paper-deep); }
  .item-row .rm {
    background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 15px;
    width: 20px; line-height: 1;
  }
  .item-row .rm:hover { color: var(--red); }

  .total-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px; padding-top: 14px; border-top: 2px solid var(--ink);
  }
  .total-row .lbl { font-family: 'Archivo Narrow', sans-serif; font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em; }
  .total-row .amt-wrap { display: flex; align-items: center; gap: 14px; }
  .total-row input.total-amt {
    width: 130px; text-align: right; border: none; background: transparent;
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 18px; color: var(--ink); padding: 2px;
  }
  .total-row input.total-amt:focus { outline: none; }
  .total-row input.total-amt.computed { color: var(--gold); font-style: italic; }

  .stamp {
    font-family: 'Archivo Narrow', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 12px;
    border: 2px solid currentColor;
    border-radius: 3px;
    transform: rotate(-4deg);
    display: inline-block;
    animation: stampdown .28s ease-out;
  }
  .stamp.match { color: var(--green); background: var(--green-bg); }
  .stamp.mismatch { color: var(--red); background: var(--red-bg); }
  .stamp.computed { color: var(--gold); background: var(--gold-bg); }
  @keyframes stampdown {
    0% { transform: rotate(-4deg) scale(1.9); opacity: 0; }
    60% { transform: rotate(-4deg) scale(0.94); opacity: 1; }
    100% { transform: rotate(-4deg) scale(1); }
  }

  .diff-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 6px;
    text-align: right;
  }

  .empty-state {
    color: var(--ink-faint);
    font-size: 13.5px;
    padding: 40px 8px;
    text-align: center;
    font-style: italic;
  }

  details.raw {
    margin-top: 26px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }
  details.raw summary {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    cursor: pointer;
  }
  details.raw pre {
    margin-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 260px;
    overflow-y: auto;
    background: var(--paper);
    border: 1px solid var(--line-soft);
    border-radius: 2px;
    padding: 10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <p class="brand-eyebrow">Local OCR + LLM · runs on your machine</p>
      <h1 class="brand">Ledger</h1>
    </div>
    <div class="conn">
      <span class="dot off" id="statusDot"></span>
      <span id="statusText">checking backend…</span>
    </div>
  </header>

  <div class="endpoint-row">
    <span>Backend</span>
    <input type="text" id="apiBase" value="http://localhost:8000">
    <span id="modelTag"></span>
  </div>

  <div class="grid">

    <!-- LEFT: source document -->
    <section class="panel">
      <p class="panel-title"><span>Source document</span><span class="idx">01</span></p>

      <div class="drop" id="drop">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M4 17v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <p class="drop-label">Drop a bill here, or click to browse</p>
        <p class="drop-sub">JPG · PNG · TIFF · BMP · PDF</p>
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.bmp,.tiff,.pdf">
      </div>

      <div class="preview" id="preview"></div>
      <p class="filename" id="filenameLabel"></p>

      <button class="primary" id="extractBtn" disabled>Extract fields</button>

      <div class="log" id="log"></div>
    </section>

    <!-- RIGHT: ledger fields -->
    <section class="panel right">
      <p class="panel-title"><span>Extracted fields</span><span class="idx">02</span></p>

      <div id="formArea">
        <div class="empty-state">Upload a bill and run extraction to fill this ledger.</div>
      </div>

    </section>

  </div>
</div>

<script>
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));

const apiBaseInput = $('#apiBase');
const statusDot = $('#statusDot');
const statusText = $('#statusText');
const modelTag = $('#modelTag');
const drop = $('#drop');
const fileInput = $('#fileInput');
const preview = $('#preview');
const filenameLabel = $('#filenameLabel');
const extractBtn = $('#extractBtn');
const logEl = $('#log');
const formArea = $('#formArea');

let selectedFile = null;
let currentValidation = null;

function apiBase() {
  return apiBaseInput.value.replace(/\/$/, '');
}

async function checkHealth() {
  try {
    const res = await fetch(apiBase() + '/api/health');
    if (!res.ok) throw new Error('bad status');
    const data = await res.json();
    statusDot.className = 'dot on';
    statusText.textContent = 'backend online';
    modelTag.textContent = '· OCR ' + data.ocr_version;
  } catch (e) {
    statusDot.className = 'dot off';
    statusText.textContent = 'backend unreachable';
    modelTag.textContent = '';
  }
}
checkHealth();
apiBaseInput.addEventListener('change', checkHealth);

drop.addEventListener('click', () => fileInput.click());
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => {
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function handleFile(file) {
  selectedFile = file;
  filenameLabel.textContent = file.name + '  (' + (file.size/1024).toFixed(0) + ' KB)';
  preview.innerHTML = '';
  if (file.type.startsWith('image/')) {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    preview.appendChild(img);
  } else {
    const chip = document.createElement('div');
    chip.className = 'pdf-chip';
    chip.textContent = 'PDF document — preview unavailable, pages will be OCR\u2019d in order';
    preview.appendChild(chip);
  }
  extractBtn.disabled = false;
  logEl.innerHTML = '';
}

function logLine(text, cls) {
  const p = document.createElement('div');
  if (cls) p.className = cls;
  p.textContent = text;
  logEl.appendChild(p);
}

extractBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  extractBtn.disabled = true;
  extractBtn.textContent = 'Extracting…';
  logEl.innerHTML = '';
  logLine('Uploading ' + selectedFile.name + ' …');
  logLine('Running OCR, then LLM structuring — this can take a while on CPU …');

  const fd = new FormData();
  fd.append('file', selectedFile);

  try {
    const res = await fetch(apiBase() + '/api/extract', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) {
      logLine('Failed: ' + (data.detail || res.statusText), 'err');
      return;
    }
    logLine('OCR extracted ' + data.ocr_char_count + ' characters.', 'ok');
    logLine('Fields parsed.', 'ok');
    renderForm(data.fields, data.validation, data.ocr_text);
  } catch (e) {
    logLine('Request failed: ' + e.message, 'err');
  } finally {
    extractBtn.disabled = false;
    extractBtn.textContent = 'Extract fields';
  }
});

// Current backend schema (llm_structuring.py):
//   bill_no, patient_name, bill_date, hospital_name, doctor_name,
//   items: [{item_name, quantity, unit_price, discount, tax, amount}],
//   subtotal, discount_amount, tax_amount, total_amount, currency
function renderForm(fields, validation, ocrText) {
  currentValidation = validation;
  formArea.innerHTML = '';

  const simpleFields = [
    ['bill_no', 'Bill no.'],
    ['patient_name', 'Patient name'],
    ['hospital_name', 'Hospital'],
    ['doctor_name', 'Doctor'],
  ];

  simpleFields.forEach(([key, label]) => {
    const row = document.createElement('div');
    row.className = 'field-row';
    row.innerHTML = `<label>${label}</label><input type="text" data-field="${key}" placeholder="not found">`;
    row.querySelector('input').value = fields[key] ?? '';
    formArea.appendChild(row);
  });

  const dateRow = document.createElement('div');
  dateRow.className = 'field-row';
  dateRow.style.borderBottom = '1px dotted var(--line)';
  dateRow.innerHTML = `
    <label>Dates</label>
    <div class="three-col">
      <div class="sub"><label>Bill date</label><input type="text" data-field="bill_date" placeholder="—"></div>
      <div class="sub"><label>Currency</label><input type="text" data-field="currency" placeholder="—"></div>
      <div class="sub"><label>Subtotal</label><input type="text" data-field="subtotal" placeholder="—"></div>
    </div>`;
  formArea.appendChild(dateRow);
  dateRow.querySelector('[data-field=bill_date]').value = fields.bill_date ?? '';
  dateRow.querySelector('[data-field=currency]').value = fields.currency ?? '';
  dateRow.querySelector('[data-field=subtotal]').value = fields.subtotal ?? '';

  // Only render the taxable value / GST breakdown row if the bill actually
  // has at least one of these values — most bills won't split it this way,
  // so skip the row entirely rather than showing four empty "—" fields.
  const hasTaxBreakdown = ['taxable_value', 'cgst_amount', 'sgst_amount', 'igst_amount']
    .some(k => fields[k] !== null && fields[k] !== undefined && fields[k] !== '');
  if (hasTaxBreakdown) {
    const taxRow = document.createElement('div');
    taxRow.className = 'field-row';
    taxRow.style.borderBottom = '1px dotted var(--line)';
    taxRow.innerHTML = `
      <label>Tax detail</label>
      <div class="three-col" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
        <div class="sub"><label>Taxable value</label><input type="text" data-field="taxable_value" placeholder="—"></div>
        <div class="sub"><label>CGST</label><input type="text" data-field="cgst_amount" placeholder="—"></div>
        <div class="sub"><label>SGST</label><input type="text" data-field="sgst_amount" placeholder="—"></div>
        <div class="sub"><label>IGST</label><input type="text" data-field="igst_amount" placeholder="—"></div>
      </div>`;
    formArea.appendChild(taxRow);
    taxRow.querySelector('[data-field=taxable_value]').value = fields.taxable_value ?? '';
    taxRow.querySelector('[data-field=cgst_amount]').value = fields.cgst_amount ?? '';
    taxRow.querySelector('[data-field=sgst_amount]').value = fields.sgst_amount ?? '';
    taxRow.querySelector('[data-field=igst_amount]').value = fields.igst_amount ?? '';
  }

  const itemsHead = document.createElement('div');
  itemsHead.className = 'items-head';
  itemsHead.innerHTML = `<span>Charge items</span><button class="add-row" type="button">+ add line</button>`;
  formArea.appendChild(itemsHead);

  const itemsWrap = document.createElement('div');
  itemsWrap.id = 'itemsWrap';
  formArea.appendChild(itemsWrap);

  // Backend returns items as an ARRAY of objects: [{item_name, amount, ...}]
  // (older schema used a flat charge_items {name: amount} object — this
  // build matches the current array-of-objects schema).
  const items = Array.isArray(fields.items) ? fields.items : [];
  items.forEach(it => addItemRow(itemsWrap, it.item_name, it.amount));
  if (items.length === 0) addItemRow(itemsWrap, '', '');

  itemsHead.querySelector('.add-row').addEventListener('click', () => addItemRow(itemsWrap, '', ''));

  // When the bill's stated total_amount wasn't extracted (e.g. it's on a
  // page we don't have, or genuinely absent), fall back to showing the sum
  // of the line items we DID extract, so the field isn't just blank. This
  // is clearly a computed stand-in, not the bill's own printed total, so
  // it's marked visually (gold/italic) and labeled rather than presented
  // as if it were read directly off the bill.
  const itemSum = items.reduce((sum, it) => {
    const n = parseFloat(it.amount);
    return Number.isFinite(n) ? sum + n : sum;
  }, 0);
  const hasStatedTotal = fields.total_amount !== null && fields.total_amount !== undefined && fields.total_amount !== '';
  const usingComputedTotal = !hasStatedTotal && itemSum > 0;

  const totalRow = document.createElement('div');
  totalRow.className = 'total-row';
  totalRow.innerHTML = `
    <span class="lbl">Total${usingComputedTotal ? ' (computed)' : ''}</span>
    <div class="amt-wrap">
      <span id="stampSlot"></span>
      <input type="text" class="total-amt" data-field="total_amount" placeholder="—">
    </div>`;
  formArea.appendChild(totalRow);
  const totalInput = totalRow.querySelector('.total-amt');
  if (hasStatedTotal) {
    totalInput.value = fields.total_amount;
  } else if (usingComputedTotal) {
    totalInput.value = itemSum.toFixed(2);
    totalInput.classList.add('computed');
    totalInput.title = "Not printed on the bill — this is the sum of the extracted line items.";
  } else {
    totalInput.value = '';
  }

  const diffNote = document.createElement('div');
  diffNote.className = 'diff-note';
  diffNote.id = 'diffNote';
  formArea.appendChild(diffNote);

  renderStamp(validation, items.length, usingComputedTotal);

  const raw = document.createElement('details');
  raw.className = 'raw';
  raw.innerHTML = `<summary>Raw JSON</summary><pre>${escapeHtml(JSON.stringify(fields, null, 2))}</pre>`;
  formArea.appendChild(raw);

  if (ocrText) {
    const ocrDetails = document.createElement('details');
    ocrDetails.className = 'raw';
    ocrDetails.innerHTML = `<summary>OCR text (what the model actually saw)</summary><pre>${escapeHtml(ocrText)}</pre>`;
    formArea.appendChild(ocrDetails);
  }
}

function addItemRow(wrap, name, amount) {
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <input type="text" class="item-name" placeholder="item name" value="${escapeAttr(name)}">
    <span class="leader">₹</span>
    <input type="text" class="item-amt" placeholder="0.00" value="${escapeAttr(amount)}">
    <button class="rm" type="button" title="remove line">×</button>`;
  row.querySelector('.rm').addEventListener('click', () => row.remove());
  wrap.appendChild(row);
}

function renderStamp(validation, itemCount, usingComputedTotal) {
  const slot = $('#stampSlot');
  const note = $('#diffNote');
  if (!slot) return;
  slot.innerHTML = '';
  if (!note) return;
  note.textContent = '';
  if (!validation || !validation.checked) {
    if (usingComputedTotal) {
      // total_amount wasn't on the bill (or wasn't extracted), but we do
      // have line items -- show that plainly rather than the generic
      // "nothing to compare against" message, since there IS a number
      // shown, it's just computed rather than printed.
      const stamp = document.createElement('span');
      stamp.className = 'stamp computed';
      stamp.textContent = 'Computed';
      slot.appendChild(stamp);
      note.textContent = 'bill total not found — showing the sum of extracted line items instead';
      return;
    }
    // "checked" is false either because there are no line items at all, or
    // because total_amount itself is null (e.g. the bill's total is on a
    // page that wasn't included in this OCR run) -- these are different
    // situations and deserve different messages.
    note.textContent = itemCount > 0
      ? 'total not found on this page — nothing to compare items against'
      : 'no charge items to check against total';
    return;
  }
  const stamp = document.createElement('span');
  stamp.className = 'stamp ' + (validation.match ? 'match' : 'mismatch');
  stamp.textContent = validation.match ? 'Balanced' : 'Mismatch';
  slot.appendChild(stamp);
  note.textContent = `computed ₹${validation.computed} vs stated ₹${validation.stated} (diff ₹${validation.diff})`;
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function escapeAttr(v) {
  return String(v ?? '').replace(/"/g, '&quot;');
}
